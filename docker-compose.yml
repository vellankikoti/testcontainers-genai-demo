services:
  db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: "postgresql+psycopg2://testuser:testpass@postgres-db:5432/testdb"
    depends_on:
      - db
    command: >
      sh -c "chmod +x /app/wait-for-it.sh &&
      /app/wait-for-it.sh -t 60 postgres-db:5432 -- python app.py"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_BASE_URL: "http://backend:5000"
    volumes:
      - ./frontend:/app
